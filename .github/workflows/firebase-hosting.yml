name: Deploy E.M Restaurant to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get website code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/543261008116/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-pool
          service_account: firebase-adminsdk-fbsvc@em-restaurant-online.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy website
        run: firebase deploy --only hosting --project em-restaurant-online