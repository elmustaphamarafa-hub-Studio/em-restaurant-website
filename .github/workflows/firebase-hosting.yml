name: Deploy E.M Restaurant to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get the website code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy website
        run: firebase deploy --only hosting --project em-restaurant-online
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}